databaseChangeLog:
  - changeSet:
      id: init-database
      author: tomtork
      preConditions:
        - onFail: HALT
          not:
            tableExists:
              tableName: building
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: building_pkey
                  name: building_id
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: building_name
                  type: VARCHAR(255)
              - column:
                  constraints:
                    nullable: false
                    unique: true
                  name: building_code
                  type: VARCHAR(50)
            tableName: building
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: apartment_pkey
                  name: apartment_id
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: apartment_number
                  type: VARCHAR(50)
              - column:
                  constraints:
                    nullable: false
                  name: total_square
                  type: FLOAT
              - column:
                  constraints:
                    nullable: false
                  name: living_square
                  type: FLOAT
              - column:
                  constraints:
                    nullable: false
                  name: rooms_amount
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: floor
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: building_id
                  type: INTEGER
            tableName: apartment
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: electricity_pkey
                  name: apartment_id
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: day_consumption
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: night_consumption
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: debt
                  type: FLOAT
                  defaultValue: 0.0
              - column:
                  constraints:
                    nullable: false
                  name: active
                  type: BOOLEAN
                  defaultValue: true
            tableName: electricity
        - createTable:
            columns:
              - column:
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: water_supply_pkey
                  name: apartment_id
                  type: INTEGER
              - column:
                  constraints:
                    nullable: false
                  name: cold_consumption
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: hot_consumption
                  type: BIGINT
              - column:
                  constraints:
                    nullable: false
                  name: debt
                  type: FLOAT
                  defaultValue: 0.0
              - column:
                  constraints:
                    nullable: false
                  name: active
                  type: BOOLEAN
                  defaultValue: true
            tableName: water_supply
        - addForeignKeyConstraint:
            baseColumnNames: building_id
            baseTableName: apartment
            constraintName: fk_apartment_to_building
            referencedColumnNames: building_id
            referencedTableName: building
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseColumnNames: apartment_id
            baseTableName: electricity
            constraintName: fk_electricity_to_apartment
            referencedColumnNames: apartment_id
            referencedTableName: apartment
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseColumnNames: apartment_id
            baseTableName: water_supply
            constraintName: fk_water_supply_to_apartment
            referencedColumnNames: apartment_id
            referencedTableName: apartment
            onDelete: CASCADE