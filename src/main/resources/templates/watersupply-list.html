<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Учет водоснабжения</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .header { margin-bottom: 30px; }
        .table { margin-top: 20px; }
        .action-buttons { white-space: nowrap; }
        .status-badge { 
            display: inline-block;
            padding: 0.25em 0.6em;
            font-size: 0.75em;
            font-weight: 700;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            vertical-align: baseline;
            border-radius: 0.25rem;
        }
        .status-active { background-color: #28a745; color: white; }
        .status-inactive { background-color: #6c757d; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Учет водоснабжения</h1>
            <a href="/" class="btn btn-secondary mb-3">На главную</a>
            <a href="/watersupply/add" class="btn btn-primary mb-3">Добавить показания</a>
        </div>

        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Холодная вода</th>
                    <th>Горячая вода</th>
                    <th>Долг</th>
                    <th>Статус</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="water : ${waterSupplyList}">
                    <td th:text="${water.id}"></td>
                    <td th:text="${#numbers.formatDecimal(water.cold, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(water.hot, 1, 2)}"></td>
                    <td th:text="${#numbers.formatDecimal(water.debt, 1, 2)}"></td>
                    <td>
                        <span th:class="${water.active} ? 'status-badge status-active' : 'status-badge status-inactive'"
                              th:text="${water.active} ? 'Активно' : 'Неактивно'">
                        </span>
                    </td>
                    <td class="action-buttons">
                        <a th:href="@{/watersupply/edit/{id}(id=${water.id})}" class="btn btn-sm btn-warning">Изменить</a>
                        <form th:action="@{/watersupply/delete/{id}(id=${water.id})}" method="post" style="display: inline-block;" onsubmit="return confirm('Вы уверены, что хотите удалить эти показания?')">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
