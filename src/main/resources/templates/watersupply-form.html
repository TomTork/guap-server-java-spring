<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${waterSupply.id} ? 'Редактировать показания воды' : 'Добавить показания воды'">Добавить показания воды</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; }
        .form-actions { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header mb-4">
            <h1 th:text="${waterSupply.id} ? 'Редактировать показания воды' : 'Добавить показания воды'">Добавить показания воды</h1>
            <a href="/watersupply" class="btn btn-secondary">Назад к списку</a>
        </div>

        <div class="form-container">
            <form th:action="${waterSupply.id} ? @{/watersupply/edit} : @{/watersupply/add}" 
                  th:object="${waterSupply}" method="post" class="needs-validation" novalidate>
                
                <input type="hidden" th:field="*{id}" />
                
                <div class="mb-3">
                    <label for="cold" class="form-label">Холодная вода</label>
                    <input type="number" step="0.01" class="form-control" id="cold" th:field="*{cold}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите показания холодной воды</div>
                </div>
                
                <div class="mb-3">
                    <label for="hot" class="form-label">Горячая вода</label>
                    <input type="number" step="0.01" class="form-control" id="hot" th:field="*{hot}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите показания горячей воды</div>
                </div>
                
                <div class="mb-3">
                    <label for="debt" class="form-label">Долг</label>
                    <input type="number" step="0.01" class="form-control" id="debt" th:field="*{debt}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите задолженность</div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                    <label class="form-check-label" for="active">Активные показания</label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/watersupply" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script>
    (function () {
        'use strict'
        
        const forms = document.querySelectorAll('.needs-validation')
        
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                
                form.classList.add('was-validated')
            }, false)
        })
    })()
    </script>
</body>
</html>
