<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${apartment.id} ? 'Редактирование квартиры' : 'Добавление квартиры'"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f8f9fa;
        }
        .form-actions {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4" th:text="${apartment.id} ? 'Редактирование квартиры' : 'Добавление квартиры'"></h1>

    <form id="apartmentForm" th:object="${apartment}" class="mt-4 needs-validation" novalidate>
        <input type="hidden" id="id" th:field="*{id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="mb-3">
            <label for="number" class="form-label">Номер квартиры</label>
            <input type="text" class="form-control" id="number" name="number" th:value="*{number}" required>
            <div class="invalid-feedback">Пожалуйста, укажите номер квартиры</div>
        </div>

        <div class="mb-3">
            <label for="buildingId" class="form-label">Здание</label>
            <select class="form-select" id="buildingId" name="buildingId" required>
                <option value="">Выберите здание</option>
                <option th:each="building : ${buildings}"
                        th:value="${building.id}"
                        th:text="${building.name} + ' (' + ${building.code} + ')'"
                        th:selected="${apartment.buildingId} == ${building.id}">
                </option>
            </select>
            <div class="invalid-feedback">Пожалуйста, выберите здание</div>
        </div>

        <div class="mb-3">
            <label for="totalSquare" class="form-label">Общая площадь</label>
            <input type="number" step="0.01" min="0" class="form-control" id="totalSquare" name="totalSquare" th:value="*{totalSquare}" required>
            <div class="invalid-feedback">Пожалуйста, укажите общую площадь</div>
        </div>

        <div class="mb-3">
            <label for="livingSquare" class="form-label">Жилая площадь</label>
            <input type="number" step="0.01" min="0" class="form-control" id="livingSquare" name="livingSquare" th:value="*{livingSquare}" required>
            <div class="invalid-feedback">Пожалуйста, укажите жилую площадь</div>
        </div>

        <div class="mb-3">
            <label for="roomsAmount" class="form-label">Количество комнат</label>
            <input type="number" class="form-control" id="roomsAmount" name="roomsAmount" th:value="*{roomsAmount}" min="1" required>
            <div class="invalid-feedback">Минимум 1 комната</div>
        </div>

        <div class="mb-3">
            <label for="floor" class="form-label">Этаж</label>
            <input type="number" class="form-control" id="floor" name="floor" th:value="*{floor}" min="0" required>
            <div class="invalid-feedback">Укажите этаж</div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span id="buttonText">Сохранить</span>
            </button>
            <a th:href="@{/apartments}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script>
    $(document).ready(function() {
        const $form = $('#apartmentForm');
        const isEdit = !!$('#id').val();

        $form.on('submit', function(e) {
            e.preventDefault();

            if (!this.checkValidity()) {
                e.stopPropagation();
                $(this).addClass('was-validated');
                return;
            }

            const totalSquare = parseFloat($('#totalSquare').val());
            const livingSquare = parseFloat($('#livingSquare').val());

            const formData = {
                id: $('#id').val() || null,
                number: $('#number').val(),
                buildingId: $('#buildingId').val(),
                totalSquare: totalSquare,
                livingSquare: livingSquare,
                roomsAmount: parseInt($('#roomsAmount').val()),
                floor: parseInt($('#floor').val()),
            };

            const url = isEdit ? '/apartments/edit' : '/apartments/add';

            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(response) {
                    window.location.href = '/apartments';
                },
                error: function(xhr) {
                    let errorMessage = 'Произошла ошибка при сохранении';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                    }
                    alert(errorMessage);
                }
            });
        });
    });
</script>
</body>
</html>
