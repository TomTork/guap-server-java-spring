<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${apartment.id} ? 'Редактировать квартиру' : 'Добавить квартиру'">Добавить квартиру</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; }
        .form-actions { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header mb-4">
            <h1 th:text="${apartment.id} ? 'Редактировать квартиру' : 'Добавить квартиру'">Добавить квартиру</h1>
            <a href="/apartments" class="btn btn-secondary">Назад к списку</a>
        </div>

        <div class="form-container">
            <form th:action="${apartment.id} ? @{/apartments/edit} : @{/apartments/add}" 
                  th:object="${apartment}" method="post" class="needs-validation" novalidate>
                
                <input type="hidden" th:field="*{id}" />
                
                <div class="mb-3">
                    <label for="number" class="form-label">Номер квартиры</label>
                    <input type="text" class="form-control" id="number" th:field="*{number}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите номер квартиры</div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="totalSquare" class="form-label">Общая площадь (м²)</label>
                        <input type="number" step="0.01" class="form-control" id="totalSquare" th:field="*{totalSquare}" required>
                        <div class="invalid-feedback">Пожалуйста, укажите общую площадь</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="livingSquare" class="form-label">Жилая площадь (м²)</label>
                        <input type="number" step="0.01" class="form-control" id="livingSquare" th:field="*{livingSquare}" required>
                        <div class="invalid-feedback">Пожалуйста, укажите жилую площадь</div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="roomsAmount" class="form-label">Количество комнат</label>
                        <input type="number" class="form-control" id="roomsAmount" th:field="*{roomsAmount}" min="1" required>
                        <div class="invalid-feedback">Пожалуйста, укажите количество комнат</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="floor" class="form-label">Этаж</label>
                        <input type="number" class="form-control" id="floor" th:field="*{floor}" min="0" required>
                        <div class="invalid-feedback">Пожалуйста, укажите этаж</div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="buildingId" class="form-label">Здание</label>
                    <select class="form-select" id="buildingId" th:field="*{buildingId}" required>
                        <option value="">Выберите здание</option>
                        <option th:each="building : ${buildings}" 
                                th:value="${building.id}" 
                                th:text="${building.name}" 
                                th:selected="${apartment.buildingId} == ${building.id}">
                        </option>
                    </select>
                    <div class="invalid-feedback">Пожалуйста, выберите здание</div>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/apartments" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script>
    (function () {
        'use strict'
        
        const forms = document.querySelectorAll('.needs-validation')
        
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                
                form.classList.add('was-validated')
            }, false)
        })
    })()
    </script>
</body>
</html>
