<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление зданиями</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .header { margin-bottom: 30px; }
        .table { margin-top: 20px; }
        .action-buttons { white-space: nowrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Управление зданиями</h1>
            <a href="/" class="btn btn-secondary mb-3">На главную</a>
            <a href="/buildings/add" class="btn btn-primary mb-3">Добавить здание</a>
        </div>

        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Код</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="building : ${buildings}">
                    <td th:text="${building.id}"></td>
                    <td th:text="${building.name}"></td>
                    <td th:text="${building.code}"></td>
                    <td class="action-buttons">
                        <a th:href="@{/buildings/edit/{id}(id=${building.id})}" class="btn btn-sm btn-warning">Изменить</a>
                        <form th:action="@{/buildings/delete/{id}(id=${building.id})}" method="post" style="display: inline-block;" onsubmit="return confirm('Вы уверены, что хотите удалить это здание?')">
                            <input type="hidden" th:name="_method" value="delete" />
                            <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
