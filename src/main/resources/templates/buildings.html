<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управление зданиями</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            padding: 20px;
            background-color: #f8f9fa;
        }
        .header { 
            margin-bottom: 30px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header h1 {
            margin: 0;
        }
        .table { 
            margin-top: 20px;
            background-color: white;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.25rem;
            overflow: hidden;
        }
        .action-buttons { 
            white-space: nowrap;
            display: flex;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Управление зданиями</h1>
            <div class="d-flex gap-2">
                <a th:href="@{/}" class="btn btn-secondary">На главную</a>
                <a th:href="@{/buildings/add}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Добавить здание
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Код</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="buildings-table-body">
                    <tr th:each="building : ${buildings}" th:data-building-id="${building.id}">
                        <td th:text="${building.id}"></td>
                        <td th:text="${building.name}"></td>
                        <td th:text="${building.code}"></td>
                        <td class="action-buttons">
                            <a th:href="@{/buildings/edit/{id}(id=${building.id})}" 
                               class="btn btn-sm btn-warning"
                               title="Изменить">
                                Изменить
                            </a>
                            <button type="button"
                                    id="confirmDelete"
                                    class="btn btn-sm btn-danger delete-btn" 
                                    th:data-id="${building.id}"
                                    th:data-name="${building.name}"
                                    title="Удалить">
                                <span>Удалить</span>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(buildings)}">
                        <td colspan="4" class="text-center">Нет доступных зданий</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $(document).on('click', '.delete-btn', function() {
            const $button = $(this);
            const id = $button.data('id');

            // Send AJAX request
            $.ajax({
                url: `/buildings/delete/${id}`,
                type: 'POST',
                success: function() {
                    $(`tr[data-building-id="${id}"]`).fadeOut(0, function() {
                        $(this).remove();
                        if ($('#buildings-table-body tr').length === 0) {
                            $('#buildings-table-body').html(`
                                <tr>
                                    <td colspan="4" class="text-center">Нет доступных зданий</td>
                                </tr>
                            `);
                        }
                    });
                },
                error: function(xhr) {
                    let errorMessage = 'Ошибка при удалении здания';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                        console.log(errorMessage);
                    }
                }
            });
        });
    });
    </script>
</body>
</html>
