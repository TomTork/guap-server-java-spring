<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${electricity.id} ? 'Редактировать показания' : 'Добавить показания'">Добавить показания</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .form-container { max-width: 600px; margin: 0 auto; }
        .form-actions { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header mb-4">
            <h1 th:text="${electricity.id} ? 'Редактировать показания' : 'Добавить показания'">Добавить показания</h1>
            <a href="/electricity" class="btn btn-secondary">Назад к списку</a>
        </div>

        <div class="form-container">
            <form th:action="${electricity.id} ? @{/electricity/edit} : @{/electricity/add}" 
                  th:object="${electricity}" method="post" class="needs-validation" novalidate>
                
                <input type="hidden" th:field="*{id}" />
                
                <div class="mb-3">
                    <label for="day" class="form-label">Показания день</label>
                    <input type="number" step="0.01" class="form-control" id="day" th:field="*{day}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите показания за день</div>
                </div>
                
                <div class="mb-3">
                    <label for="night" class="form-label">Показания ночь</label>
                    <input type="number" step="0.01" class="form-control" id="night" th:field="*{night}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите показания за ночь</div>
                </div>
                
                <div class="mb-3">
                    <label for="debt" class="form-label">Долг</label>
                    <input type="number" step="0.01" class="form-control" id="debt" th:field="*{debt}" required>
                    <div class="invalid-feedback">Пожалуйста, укажите задолженность</div>
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="active" th:field="*{active}">
                    <label class="form-check-label" for="active">Активные показания</label>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/electricity" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script>
    (function () {
        'use strict'
        
        const forms = document.querySelectorAll('.needs-validation')
        
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                
                form.classList.add('was-validated')
            }, false)
        })
    })()
    </script>
</body>
</html>
