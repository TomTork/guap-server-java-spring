<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${electricity.id} ? 'Редактирование показаний' : 'Добавление показаний'"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f8f9fa;
        }
        .form-actions {
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mb-4">
        <span th:text="${electricity.id} ? 'Редактирование показаний' : 'Добавление показаний'"></span>
    </h1>

    <form id="electricityForm" th:object="${electricity}" class="needs-validation" novalidate>
        <input type="hidden" id="electricityId" th:field="*{id}">

        <div class="mb-3" th:if="${electricity.id}">
            <label class="form-label">ID квартиры</label>
            <div class="form-control">
                <span th:text="${electricity.id}"></span>
            </div>
        </div>
        
        <div class="mb-3" th:unless="${electricity.id}">
            <label for="apartmentId" class="form-label">ID квартиры</label>
            <input type="number" class="form-control" id="apartmentId" name="apartmentId" 
                   th:value="${electricity.id}" min="1" required>
            <div class="invalid-feedback">Пожалуйста, укажите ID квартиры</div>
        </div>

        <div class="mb-3">
            <label for="day" class="form-label">Показания день</label>
            <input type="number" step="0.001" class="form-control" id="day" name="day" th:value="${electricity.day}" required>
            <div class="invalid-feedback">Пожалуйста, введите показания дня</div>
        </div>

        <div class="mb-3">
            <label for="night" class="form-label">Показания ночь</label>
            <input type="number" step="0.001" class="form-control" id="night" name="night"
                   th:value="${electricity.night}" required>
            <div class="invalid-feedback">Пожалуйста, введите показания ночи</div>
        </div>

        <div class="mb-3">
            <label for="debt" class="form-label">Долг</label>
            <div class="input-group">
                <input type="number" step="0.01" class="form-control" id="debt" name="debt"
                       th:value="${electricity.debt}" required>
                <div class="invalid-feedback">Пожалуйста, укажите задолженность</div>
            </div>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="active" name="active"
                   th:checked="${electricity.active == null || electricity.active}">
            <label class="form-check-label" for="active">Активные показания</label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">Сохранить</button>
            <a th:href="@{/electricity}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>

<script>
    $(document).ready(function() {
        const $form = $('#electricityForm');
        const isEdit = !!$('#electricityId').val();

        $form.on('submit', function(e) {
            e.preventDefault();

            if (!this.checkValidity()) {
                e.stopPropagation();
                $(this).addClass('was-validated');
                return;
            }

            const formData = {
                id: $('#electricityId').val() || null,
                day: parseFloat($('#day').val()) || 0,
                night: parseFloat($('#night').val()) || 0,
                debt: parseFloat($('#debt').val()) || 0,
                active: $('#active').is(':checked'),
                apartmentId: $('#electricityId').val() || $('#apartmentId').val()
            };

            const url = isEdit ? '/electricity/edit' : '/electricity/add';

            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(response) {
                    window.location.href = '/electricity';
                },
                error: function(xhr) {
                    let errorMessage = 'Произошла ошибка при сохранении';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                    }
                    alert(errorMessage);
                }
            });
        });
    });
</script>
</body>
</html>
