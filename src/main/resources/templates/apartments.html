<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Управление квартирами</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .header { margin-bottom: 30px; }
        .table { margin-top: 20px; }
        .action-buttons { white-space: nowrap; }
        .utility-info { font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Управление квартирами</h1>
            <a href="/" class="btn btn-secondary mb-3">На главную</a>
            <a href="/apartments/add" class="btn btn-primary mb-3">Добавить квартиру</a>
        </div>

        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Номер</th>
                    <th>Общ. пл.</th>
                    <th>Жил. пл.</th>
                    <th>Комнат</th>
                    <th>Этаж</th>
                    <th>Здание</th>
                    <th>Коммунальные услуги</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="apartment : ${apartments}">
                    <td th:text="${apartment.id}"></td>
                    <td th:text="${apartment.number}"></td>
                    <td th:text="${apartment.totalSquare}"></td>
                    <td th:text="${apartment.livingSquare}"></td>
                    <td th:text="${apartment.roomsAmount}"></td>
                    <td th:text="${apartment.floor}"></td>
                    <td th:text="${apartment.buildingName != null} ? ${apartment.buildingName} : '—'"></td>
                    <td>
                        <div class="utility-info" th:if="${apartment.electricity != null}">
                            <strong>Эл-во:</strong> День: <span th:text="${apartment.electricity.day}"></span>, 
                            Ночь: <span th:text="${apartment.electricity.night}"></span><br>
                            <strong>Долг:</strong> <span th:text="${apartment.electricity.debt}"></span>
                        </div>
                        <div class="utility-info" th:if="${apartment.waterSupply != null}" style="margin-top: 5px;">
                            <strong>Вода:</strong> Хол.: <span th:text="${apartment.waterSupply.cold}"></span>, 
                            Гор.: <span th:text="${apartment.waterSupply.hot}"></span><br>
                            <strong>Долг:</strong> <span th:text="${apartment.waterSupply.debt}"></span>
                        </div>
                        <div th:if="${apartment.electricity == null && apartment.waterSupply == null}">—</div>
                    </td>
                    <td class="action-buttons">
                        <a th:href="@{/apartments/edit/{id}(id=${apartment.id})}" class="btn btn-sm btn-warning">Изменить</a>
                        <form th:action="@{/apartments/delete/{id}(id=${apartment.id})}" method="post" style="display: inline-block;" onsubmit="return confirm('Вы уверены, что хотите удалить эту квартиру?')">
                            <input type="hidden" name="_method" value="delete" />
                            <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
