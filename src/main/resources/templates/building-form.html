<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${building.id} ? 'Редактирование здания' : 'Добавление здания'"></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto;
            background-color: #f8f9fa;
        }
        .form-actions { 
            margin-top: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4" th:text="${building.id} ? 'Редактирование здания' : 'Добавление здания'"></h1>
        
        <form id="buildingForm" th:object="${building}" class="mt-4">
            <input type="hidden" th:field="*{id}" id="buildingId" th:if="${building.id}">
            
            <div class="mb-3">
                <label for="name" class="form-label">Название</label>
                <input type="text" class="form-control" id="name" name="name" th:value="*{name}" required>
                <div class="invalid-feedback">Пожалуйста, введите название здания</div>
            </div>
            
            <div class="mb-3">
                <label for="code" class="form-label">Код</label>
                <input type="text" class="form-control" id="code" name="code" th:value="*{code}" required>
                <div class="invalid-feedback">Пожалуйста, введите код здания</div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="buttonText">Сохранить</span>
                </button>
                <a th:href="@{/buildings}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>

    <script>
    $(document).ready(function() {
        const $form = $('#buildingForm');
        const isEdit = !!$('#buildingId').val();
        
        $form.on('submit', function(e) {
            e.preventDefault();
            
            if (!this.checkValidity()) {
                e.stopPropagation();
                $(this).addClass('was-validated');
                return;
            }
            
            const formData = {
                id: $('#buildingId').val() || null,
                name: $('#name').val(),
                code: $('#code').val(),
            };
            
            const url = isEdit ? '/buildings/edit' : '/buildings/add';
            
            $.ajax({
                url: url,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(formData),
                success: function(response) {
                    window.location.href = '/buildings';
                },
                error: function(xhr) {
                    let errorMessage = 'Произошла ошибка при сохранении';
                    if (xhr.responseJSON && xhr.responseJSON.message) {
                        errorMessage = xhr.responseJSON.message;
                        console.log(errorMessage);
                    }
                }
            });
        });
    });
    </script>
</body>
</html>
