<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${building.id} ? 'Редактирование здания' : 'Добавление здания'"></title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-actions { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${building.id} ? 'Редактирование здания' : 'Добавление здания'"></h1>
        
        <form th:action="${building.id} ? @{/buildings/edit} : @{/buildings/add}" 
              th:object="${building}" method="post" class="mt-4">
            
            <input type="hidden" th:field="*{id}" th:if="${building.id}">
            
            <div class="mb-3">
                <label for="name" class="form-label">Название</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <div class="mb-3">
                <label for="code" class="form-label">Код</label>
                <input type="text" class="form-control" id="code" th:field="*{code}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/buildings" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
