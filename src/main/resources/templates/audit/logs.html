<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .audit-logs {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        .audit-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .audit-table th, .audit-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        .audit-table th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        .audit-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .audit-table tr:hover {
            background-color: #f1f1f1;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }
        .filters {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="audit-logs">
        <h1>Audit Logs</h1>
        
        <div class="filters">
            <h3>Filters:</h3>
            <a th:href="@{/audit}" class="btn">Show All</a>
            <a th:href="@{/audit?success=true}" class="btn">Successful Actions</a>
            <a th:href="@{/audit?success=false}" class="btn">Failed Actions</a>
        </div>

        <table class="audit-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>User</th>
                    <th>Action</th>
                    <th>Details</th>
                    <th>IP Address</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="event : ${events}">
                    <td th:text="${#temporals.format(event.timestamp, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td>
                        <a th:href="@{/audit?username={username}(username=${event.username})}" 
                           th:text="${event.username}"></a>
                    </td>
                    <td>
                        <a th:href="@{/audit?action={action}(action=${event.action})}" 
                           th:text="${event.action}"></a>
                    </td>
                    <td th:text="${event.details}"></td>
                    <td th:text="${event.ipAddress}"></td>
                    <td>
                        <span th:class="${event.success} ? 'success' : 'error'"
                              th:text="${event.success} ? 'SUCCESS' : 'FAILED'">
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
