<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .auth-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="card shadow">
        <div class="card-body p-4">
            <h2 class="text-center mb-4">Регистрация</h2>

            <div id="alert-box" class="alert d-none"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Имя пользователя</label>
                    <input type="text" id="username" name="username" class="form-control"
                           pattern="[A-Za-z0-9_]{3,20}" required>
                    <div class="form-text">От 3 до 20 символов (буквы, цифры, _)</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" id="password" name="password" class="form-control"
                           minlength="6" required>
                    <div class="form-text">Не менее 6 символов</div>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <span id="registerButtonText">Зарегистрироваться</span>
                        <span id="registerSpinner" class="spinner-border spinner-border-sm d-none"></span>
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
            </div>
        </div>
    </div>
</div>

<script>
    $(function() {
        const $form = $('#registerForm');
        const $alert = $('#alert-box');
        const $btn = $form.find('button[type="submit"]');
        const $spinner = $('#registerSpinner');
        const $btnText = $('#registerButtonText');

        $form.on('submit', function(e) {
            e.preventDefault();
            $alert.addClass('d-none').removeClass('alert-danger alert-success');

            $btn.prop('disabled', true);
            $spinner.removeClass('d-none');
            $btnText.text('Регистрация...');

            $.ajax({
                url: '/register',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: $('#username').val(),
                    password: $('#password').val()
                }),
                success: function(resp) {
                    $alert.text('Регистрация успешна! Сейчас вы будете перенаправлены...')
                        .removeClass('d-none').addClass('alert-success');
                    setTimeout(() => window.location.href = resp.redirect, 1500);
                },
                error: function(xhr) {
                    let msg = 'Ошибка регистрации';
                    if (xhr.responseJSON?.message) msg = xhr.responseJSON.message;
                    $alert.text(msg).removeClass('d-none').addClass('alert-danger');
                },
                complete: function() {
                    $btn.prop('disabled', false);
                    $spinner.addClass('d-none');
                    $btnText.text('Зарегистрироваться');
                }
            });
        });
    });
</script>
</body>
</html>
